<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>{% block title %}Dashboard{% endblock %} · Fee Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  {% if session.get('authenticated') %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('dashboard') }}">
        <span class="brand-mark">₹</span>
        <span class="brand-text">Fee Portal</span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
        <a href="{{ url_for('add_student') }}" class="{{ 'active' if request.endpoint == 'add_student' }}">Add student</a>
        <a href="{{ url_for('logout') }}">Log out</a>
      </nav>
    </div>
  </header>
  {% endif %}
  <main class="{% block main_class %}container{% endblock %}">
    {% block body %}{% endblock %}
  </main>
</body>
</html>

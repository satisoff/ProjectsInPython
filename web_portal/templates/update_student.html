{% extends "base.html" %}
{% block body %}
<h1>Update Student</h1>
<nav><a href="{{ url_for('dashboard') }}">Back</a></nav>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if student %}
<form method="post" class="card">
  <label>Name <input type="text" name="st_name" placeholder="{{ student.st_name }}"></label>
  <label>Class <input type="number" name="class" min="1" max="12" placeholder="{{ student.class }}"></label>
  <label>Section <input type="text" name="sec" maxlength="1" placeholder="{{ student.sec }}"></label>
  <label>Contact <input type="text" name="cont_no" pattern="\d{10}" placeholder="{{ student.cont_no }}"></label>
  <button type="submit">Update</button>
</form>
{% endif %}
{% endblock %}
